[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-keydb-client"
version = "0.1.0"
description = "Python SDK for SwarmKeyDb — WebSocket-first, async/sync Redis-compatible client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
hiredis = ["hiredis>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/scholtz/swarm-keydb"
Documentation = "https://github.com/scholtz/swarm-keydb/blob/main/docs/python-sdk.md"
Repository = "https://github.com/scholtz/swarm-keydb"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_keydb_client*"]

[tool.setuptools.package-data]
swarm_keydb_client = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.9"
