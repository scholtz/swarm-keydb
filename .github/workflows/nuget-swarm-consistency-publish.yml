name: Publish SwarmConsistency NuGet

on:
  push:
    tags:
      - "swarm-consistency-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/SwarmKeyDb.SwarmConsistency/SwarmKeyDb.SwarmConsistency.csproj

      - name: Pack
        run: dotnet pack src/SwarmKeyDb.SwarmConsistency/SwarmKeyDb.SwarmConsistency.csproj --configuration Release --no-restore -o ./artifacts

      - name: Publish to NuGet.org
        run: dotnet nuget push ./artifacts/SwarmKeyDb.SwarmConsistency.*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
