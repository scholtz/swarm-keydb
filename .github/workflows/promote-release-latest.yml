name: Promote Release Tag To Latest

on:
  workflow_dispatch:
    inputs:
      release_date:
        description: "Release date suffix in UTC (YYYYMMDD) for tag release-YYYYMMDD"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
    - name: Resolve image names
      id: vars
      env:
        DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      run: |
        USERNAME="${DOCKERHUB_USERNAME:-scholtz2}"
        IMAGE_NAME="${DOCKER_IMAGE_NAME:-swarm-keydb}"
        RELEASE_DATE="${{ github.event.inputs.release_date }}"
        if ! [[ "$RELEASE_DATE" =~ ^[0-9]{8}$ ]]; then
          echo "release_date must be in YYYYMMDD format" >&2
          exit 1
        fi
        REPOSITORY="${USERNAME}/${IMAGE_NAME}"
        echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
        echo "source_tag=release-${RELEASE_DATE}" >> "$GITHUB_OUTPUT"

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME || 'scholtz2' }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Validate source release tag exists
      run: |
        docker buildx imagetools inspect "${{ steps.vars.outputs.repository }}:${{ steps.vars.outputs.source_tag }}" > /dev/null

    - name: Promote release tag to latest
      run: |
        docker buildx imagetools create \
          --tag "${{ steps.vars.outputs.repository }}:latest" \
          "${{ steps.vars.outputs.repository }}:${{ steps.vars.outputs.source_tag }}"
