name: Helm Publish

on:
  push:
    tags:
      - 'chart-v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/swarm-keydb

      - name: Render chart templates
        run: helm template swarm-keydb helm/swarm-keydb > /tmp/swarm-keydb-rendered.yaml

      - name: Configure Helm chart repository
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Publish chart
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          charts_dir: helm
          pages_branch: gh-pages
          packages_with_index: true
