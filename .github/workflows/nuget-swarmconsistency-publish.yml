name: Publish SwarmConsistency NuGet

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-swarmconsistency:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Resolve package metadata
      id: vars
      env:
        NUGET_PACKAGE_ID: ${{ vars.NUGET_PACKAGE_ID }}
      run: |
        PACKAGE_ID="${NUGET_PACKAGE_ID:-SwarmKeyDb.SwarmConsistency}"
        VERSION="1.0.$(date -u +'%Y%m%d').$(date -u +'%H%M%S')"
        echo "package_id=${PACKAGE_ID}" >> "$GITHUB_OUTPUT"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Restore package project
      run: dotnet restore src/SwarmKeyDb.SwarmConsistency/SwarmKeyDb.SwarmConsistency.csproj

    - name: Build package project
      run: dotnet build src/SwarmKeyDb.SwarmConsistency/SwarmKeyDb.SwarmConsistency.csproj -c Release --no-restore

    - name: Pack NuGet package
      run: |
        dotnet pack src/SwarmKeyDb.SwarmConsistency/SwarmKeyDb.SwarmConsistency.csproj \
          -c Release \
          --no-build \
          -o ./artifacts/nuget \
          /p:Version=${{ steps.vars.outputs.version }} \
          /p:PackageVersion=${{ steps.vars.outputs.version }}

    - name: Publish package to NuGet.org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        NUGET_SOURCE_URL: ${{ vars.NUGET_SOURCE_URL }}
      run: |
        SOURCE_URL="${NUGET_SOURCE_URL:-https://api.nuget.org/v3/index.json}"
        dotnet nuget push ./artifacts/nuget/${{ steps.vars.outputs.package_id }}.${{ steps.vars.outputs.version }}.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source "$SOURCE_URL" \
          --skip-duplicate
