name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore SwarmKeyDb.slnx

    - name: Build
      run: dotnet build SwarmKeyDb.slnx --configuration Release --no-restore

    - name: Run tests
      run: dotnet run --project tests/SwarmKeyDb.Tests/SwarmKeyDb.Tests.csproj
