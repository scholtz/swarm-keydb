name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore SwarmKeyDb.slnx

    - name: Build
      run: dotnet build SwarmKeyDb.slnx --configuration Release --no-restore

    - name: Run tests
      run: dotnet test tests/SwarmKeyDb.Tests/SwarmKeyDb.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: TestResults/*.trx

    - name: Run C# examples
      run: |
        dotnet run --project examples/RangeScanExample/RangeScanExample.csproj
        dotnet run --project examples/UserProfileExample/UserProfileExample.csproj
        dotnet run --project examples/BatchOperationsExample/BatchOperationsExample.csproj

  sdk-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: JavaScript SDK tests
      run: |
        cd swarm-keydb-js
        npm ci
        npm test

    - name: React connector tests
      run: |
        cd swarm-keydb-react
        npm ci
        npm test

    - name: Node connector tests
      run: |
        cd swarm-keydb-node
        npm ci
        npm test

    - name: JavaScript example syntax check
      run: |
        node --check swarm-keydb-js/examples/user-profile.mjs
        node --check swarm-keydb-js/examples/config-management.mjs
        node --check swarm-keydb-js/examples/chat-message-history.mjs
        node --check examples/node-express/server.js

    - name: React example build
      run: |
        cd examples/react-app
        npm ci
        npm run build

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Python SDK tests
      run: |
        cd swarm-keydb-py
        pip install .
        python -m unittest discover -s tests -v

    - name: Python example syntax check
      run: |
        python -m py_compile swarm-keydb-py/examples/user_profile.py
        python -m py_compile swarm-keydb-py/examples/config_management.py
        python -m py_compile swarm-keydb-py/examples/chat_message_history.py

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.22"
        cache-dependency-path: sdk/go/go.sum

    - name: Go SDK tests
      run: |
        cd swarm-keydb-go
        go test ./...

  sdk-js-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        registry-url: https://registry.npmjs.org

    - name: JavaScript SDK build and unit tests
      run: |
        cd sdk/js
        npm ci
        npm run typecheck
        npm test
        npm run build
        npm publish --dry-run

    - name: Install Playwright Chromium
      run: |
        cd sdk/js
        npx playwright install --with-deps chromium

    - name: JavaScript SDK Playwright integration tests
      run: |
        set -euo pipefail
        BACKEND=memory SWARM_KEYDB_WS_PORT=8765 SWARM_KEYDB_HTTP_PORT=8080 SWARM_KEYDB_WS_CORS_ORIGINS=* SWARM_KEYDB_HTTP_CORS_ORIGINS=* dotnet run --project src/SwarmKeyDb.Server/SwarmKeyDb.Server.csproj --configuration Release > /tmp/swarmkeydb-js.log 2>&1 &
        SERVER_PID=$!
        trap 'kill ${SERVER_PID}' EXIT
        for i in {1..60}; do
          if nc -z 127.0.0.1 8765 && nc -z 127.0.0.1 8080; then
            break
          fi
          sleep 1
        done
        cd sdk/js
        npm run test:integration

  sdk-python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Python SDK unit tests and package dry-run checks
      run: |
        cd sdk/python
        python -m pip install --upgrade pip
        pip install -e ".[dev]" build twine
        pytest tests/unit/ -v
        python -m build
        twine check dist/*

    - name: Python SDK integration tests
      run: |
        set -euo pipefail
        BACKEND=memory SWARM_KEYDB_WS_PORT=8765 SWARM_KEYDB_HTTP_PORT=8080 SWARM_KEYDB_WS_CORS_ORIGINS=* SWARM_KEYDB_HTTP_CORS_ORIGINS=* dotnet run --project src/SwarmKeyDb.Server/SwarmKeyDb.Server.csproj --configuration Release > /tmp/swarmkeydb-py.log 2>&1 &
        SERVER_PID=$!
        trap 'kill ${SERVER_PID}' EXIT
        for i in {1..60}; do
          if nc -z 127.0.0.1 8765 && nc -z 127.0.0.1 8080; then
            break
          fi
          sleep 1
        done
        cd sdk/python
        pytest tests/integration/test_ci_smoke.py -v -m integration --override-ini="asyncio_mode=auto"

  sdk-go-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.22"

    - name: Go SDK unit tests
      run: |
        cd sdk/go
        go test ./tests/unit/ -v -timeout 30s

    - name: Go SDK integration tests
      run: |
        set -euo pipefail
        BACKEND=memory SWARM_KEYDB_WS_PORT=8765 SWARM_KEYDB_HTTP_PORT=8080 SWARM_KEYDB_WS_CORS_ORIGINS=* SWARM_KEYDB_HTTP_CORS_ORIGINS=* dotnet run --project src/SwarmKeyDb.Server/SwarmKeyDb.Server.csproj --configuration Release > /tmp/swarmkeydb-go.log 2>&1 &
        SERVER_PID=$!
        trap 'kill ${SERVER_PID}' EXIT
        for i in {1..60}; do
          if nc -z 127.0.0.1 8765 && nc -z 127.0.0.1 8080; then
            break
          fi
          sleep 1
        done
        cd sdk/go
        go test ./tests/integration/ -v -timeout 120s

  docker-publish:
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - sdk-tests
      - sdk-js-tests
      - sdk-python-tests
      - sdk-go-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Resolve image tags
      id: vars
      env:
        DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      run: |
        USERNAME="${DOCKERHUB_USERNAME:-scholtz2}"
        IMAGE_NAME="${DOCKER_IMAGE_NAME:-swarm-keydb}"
        RELEASE_TAG="release-$(date -u +'%Y%m%d')"
        echo "repository=${USERNAME}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
        echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME || 'scholtz2' }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push zero-day and dated release tags
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        pull: true
        tags: |
          ${{ steps.vars.outputs.repository }}:zero-day
          ${{ steps.vars.outputs.repository }}:${{ steps.vars.outputs.release_tag }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
