<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SwarmKeyDb HTTP REST Demo</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; max-width: 720px; }
    code { background: #f5f5f5; padding: 0.1rem 0.25rem; }
    label { display: block; margin-top: 0.8rem; }
    button { margin-top: 0.8rem; margin-right: 0.5rem; }
    pre { background: #f5f5f5; padding: 0.75rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>SwarmKeyDb HTTP REST Demo</h1>
  <p>Uses browser <code>fetch()</code> with no Redis client dependency.</p>

  <label>
    Base URL
    <input id="base" value="http://localhost:8080" size="40" />
  </label>
  <label>
    Key
    <input id="key" value="demo-key" size="24" />
  </label>
  <label>
    Value
    <input id="value" value="hello-http" size="24" />
  </label>

  <div>
    <button id="set">SET</button>
    <button id="get">GET</button>
    <button id="del">DEL</button>
  </div>

  <pre id="output">Ready.</pre>

  <script>
    const output = document.getElementById("output");
    const base = () => document.getElementById("base").value.replace(/\/+$/, "");
    const key = () => encodeURIComponent(document.getElementById("key").value);
    const value = () => document.getElementById("value").value;

    async function call(method, path, body) {
      const response = await fetch(`${base()}${path}`, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const payload = await response.json();
      output.textContent = JSON.stringify({ status: response.status, ...payload }, null, 2);
    }

    document.getElementById("set").addEventListener("click", () => call("POST", `/set/${key()}`, { value: value() }));
    document.getElementById("get").addEventListener("click", () => call("GET", `/get/${key()}`));
    document.getElementById("del").addEventListener("click", () => call("DELETE", `/del/${key()}`));
  </script>
</body>
</html>
