apiVersion: v1
kind: Service
metadata:
  name: swarm-bee-api
  namespace: swarm-keydb
spec:
  selector:
    app: swarm-bee
  ports:
    - name: api
      port: 1633
      targetPort: 1633
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: swarm-bee-p2p
  namespace: swarm-keydb
spec:
  selector:
    app: swarm-bee
  ports:
    - name: p2p-tcp
      port: 1634
      targetPort: 1634
      protocol: TCP
    - name: p2p-udp
      port: 1634
      targetPort: 1634
      protocol: UDP
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swarm-bee-data
  namespace: swarm-keydb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-bee
  namespace: swarm-keydb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarm-bee
  template:
    metadata:
      labels:
        app: swarm-bee
    spec:
      containers:
        - name: bee
          image: ethersphere/bee:2.6.0
          imagePullPolicy: IfNotPresent
          env:
            - name: BEE_API_ADDR
              valueFrom:
                configMapKeyRef:
                  name: swarm-keydb-config
                  key: BEE_API_ADDR
            - name: BEE_BLOCKCHAIN_RPC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: swarm-keydb-config
                  key: BEE_BLOCKCHAIN_RPC_ENDPOINT
            - name: BEE_DATA_DIR
              value: /var/lib/bee
            - name: BEE_FULL_NODE
              valueFrom:
                configMapKeyRef:
                  name: swarm-keydb-config
                  key: BEE_FULL_NODE
            - name: BEE_MAINNET
              valueFrom:
                configMapKeyRef:
                  name: swarm-keydb-config
                  key: BEE_MAINNET
            - name: BEE_NAT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: swarm-keydb-config
                  key: BEE_NAT_ADDR
            - name: BEE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swarm-keydb-secrets
                  key: BEE_PASSWORD
            - name: BEE_P2P_ADDR
              valueFrom:
                configMapKeyRef:
                  name: swarm-keydb-config
                  key: BEE_P2P_ADDR
            - name: BEE_SWAP_ENABLE
              valueFrom:
                configMapKeyRef:
                  name: swarm-keydb-config
                  key: BEE_SWAP_ENABLE
          ports:
            - containerPort: 1633
              name: api
            - containerPort: 1634
              name: p2p-tcp
              protocol: TCP
            - containerPort: 1634
              name: p2p-udp
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /health
              port: 1633
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 1633
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: bee-data
              mountPath: /var/lib/bee
      volumes:
        - name: bee-data
          persistentVolumeClaim:
            claimName: swarm-bee-data